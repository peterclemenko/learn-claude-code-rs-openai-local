[package]
authors = ["Peter Clemenko <aoi@protonmail.ch>"]
edition = "2021"
# If you change the name here, you must also do it in flake.nix (and run `cargo generate-lockfile` afterwards)
name = "learn-claude-code-rs-openai-local"
description = "A simple Rust project using Nix"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
async-openai = "0.42.2"
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4.3.14", features = ["derive"] }
cron = "0.17.0"
derive_builder = "0.20.2"
dotenvy = "0.15.7"
fs4 = "1.1.0"
inquire = "0.9.4"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
schemars = "1.2.3"
serde = "1.0.229"
serde_json = "1.0.154"
serde_yaml = "0.9.34"
strum = "0.28.0"
strum_macros = "0.28.0"
syn = { version = "3.0.9", features = ["full"] }
tera = "2.4.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "rt"] }
walkdir = "2.5.0"
wildmatch = "2.7.0"
