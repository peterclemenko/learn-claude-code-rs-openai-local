# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = ["learn-claude-code-rs-openai-local"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
async-openai = { version = "0.42.2", features = ["_api"] }
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4.3.14", features = ["derive"] }
cron = "0.17.0"
derive_builder = "0.20.2"
dotenvy = "0.15.7"
fs4 = "1.1.0"
inquire = "0.9.4"
opentelemetry = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
rmcp = { version = "1.4.0", default-features = false, features = ["client", "transport-child-process"] }
ron = "0.12.2"
schemars = "1.2.3"
serde = "1.0.229"
serde_json = "1.0.154"
serde_yaml = "0.9.34"
strum = "0.28.0"
strum_macros = "0.28.0"
syn = { version = "3.0.9", features = ["full"] }
tera = "2.4.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "rt", "process", "time", "fs"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"
wildmatch = "2.7.0"
